<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lançamento e Sincronização</title>
  <style>
    body { font-family: sans-serif; max-width: 650px; margin: 30px auto; padding: 0 15px; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
    input, button { padding: 8px 12px; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
  </style>
</head>
<body>

  <h2>Lançar Dados</h2>
  <form id="meuForm">
    <input type="text" id="nome" placeholder="Nome / Identificador" required>
    <input type="text" id="valor" placeholder="Valor / Quantidade" required>
    <input type="text" id="status" placeholder="Status / Observação">
    <button type="submit" id="btnSalvar">Salvar Lançamento</button>
  </form>

  <hr>

  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h2>Dados da Planilha</h2>
    <button id="btnSincronizar">🔄 Sincronizar</button>
  </div>

  <table id="tabelaDados">
    <thead>
      <tr>
        <th>Data</th>
        <th>Nome</th>
        <th>Valor</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    // Substitua pela URL da implantação do Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbwdmXFiyQaixAdePN6B42agxBAQ4eqnhfQ4-5L129ZhlMruT6be2zr9oajPu09--R8fJQ/exec";

    // 1. Enviar Dados (Lançar)
    document.getElementById("meuForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnSalvar");
      btn.disabled = true;
      btn.innerText = "Salvando...";

      const payload = {
        nome: document.getElementById("nome").value,
        valor: document.getElementById("valor").value,
        status: document.getElementById("status").value
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        alert("Registro adicionado com sucesso!");
        document.getElementById("meuForm").reset();
        sincronizarDados();
      } catch (err) {
        alert("Erro ao enviar: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Salvar Lançamento";
      }
    });

    // 2. Sincronizar / Buscar Dados
    async function sincronizarDados() {
      const btn = document.getElementById("btnSincronizar");
      btn.disabled = true;
      btn.innerText = "Sincronizando...";

      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        const tbody = document.querySelector("#tabelaDados tbody");
        tbody.innerHTML = "";

        data.forEach(item => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${item.timestamp ? new Date(item.timestamp).toLocaleString() : "-"}</td>
            <td>${item.nome}</td>
            <td>${item.valor}</td>
            <td>${item.status}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        alert("Erro na sincronização: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "🔄 Sincronizar";
      }
    }

    document.getElementById("btnSincronizar").addEventListener("click", sincronizarDados);
  </script>
</body>
</html>
